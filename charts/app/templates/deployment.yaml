{{- $hasSite := include "app.hasSite" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  labels: { app: {{ .Values.name }} }
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: { app: {{ .Values.name }} }
  template:
    metadata:
      labels: { app: {{ .Values.name }} }
      annotations:
        bagan.io/schedule: {{ .Values.schedule | default "worker" | quote }}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Values.name }}
          image: {{ .Values.image | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
          ports:
            - containerPort: {{ .Values.port }}
          {{- with .Values.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if $hasSite }}
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
          {{- end }}
      {{- if $hasSite }}
      volumes:
        - name: site
          configMap:
            name: {{ include "app.siteConfigMap" . }}
      {{- end }}
