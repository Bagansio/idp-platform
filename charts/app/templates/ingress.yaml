{{- $host := include "app.host" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.name }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: {{ include "app.entrypoint" . }}
    traefik.ingress.kubernetes.io/router.tls: "true"
    {{- $mw := include "app.middlewares" . }}
    {{- if $mw }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ $mw }}
    {{- end }}
spec:
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.name }}
                port:
                  number: 80
  tls:
    - hosts:
        - {{ $host | quote }}
